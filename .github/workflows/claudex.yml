name: Claudex

on:
  pull_request:
    paths:
      - "cmd/claudex/**"
      - "cmd/claudexdesktop/**"
      - "internal/claudex/**"
      - "script/build_and_run.sh"
      - "claudex.example.yaml"
      - "claudex.ps1"
      - "claudex.cmd"
      - "Dockerfile"
      - ".gitignore"
      - "README.md"
      - "README.ja.md"
      - "CHANGES.md"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/claudex.yml"
  push:
    branches:
      - main
    paths:
      - "cmd/claudex/**"
      - "cmd/claudexdesktop/**"
      - "internal/claudex/**"
      - "script/build_and_run.sh"
      - "claudex.example.yaml"
      - "claudex.ps1"
      - "claudex.cmd"
      - "Dockerfile"
      - ".gitignore"
      - "README.md"
      - "README.ja.md"
      - "CHANGES.md"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/claudex.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd/claudex cmd/claudexdesktop internal/claudex)"
      - name: Test focused packages
        run: |
          set -o pipefail
          go test ./internal/claudex ./cmd/claudex ./cmd/claudexdesktop 2>&1 | tee claudex-test.log
      - name: Vet all packages
        run: go vet ./...
      - name: Test all packages
        run: go test ./...
      - name: Race test focused packages
        run: go test -race ./internal/claudex ./cmd/claudexdesktop
      - name: Upload test failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claudex-test-log
          path: claudex-test.log
          if-no-files-found: ignore
      - name: Build Claudex commands
        run: go build ./cmd/claudex ./cmd/claudexdesktop

  macos-desktop-bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ClaudexDesktop bundle
        run: ./script/build_and_run.sh --build-only
      - name: Verify bundle contents
        run: |
          test -x dist/ClaudexDesktop.app/Contents/MacOS/ClaudexDesktop
          test -x dist/ClaudexDesktop.app/Contents/Resources/claudex-server
          test -f dist/ClaudexDesktop.app/Contents/Resources/claudex.example.yaml
          /usr/bin/plutil -lint dist/ClaudexDesktop.app/Contents/Info.plist

  upstream-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate upstream ownership coverage
        run: python3 scripts/claudex-upstream-sync.py --check-manifest
